# Production must use an external database and explicitly configured credentials.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
app.bootstrap.email=${ADMIN_EMAIL}
app.bootstrap.password=${ADMIN_PASSWORD}
app.cors.origins=${CORS_ORIGINS:${RENDER_EXTERNAL_URL}}
server.forward-headers-strategy=framework
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
