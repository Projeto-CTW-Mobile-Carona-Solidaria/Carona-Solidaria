spring.application.name=carona-solidaria
server.port=${PORT:8079}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/carona;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Sao_Paulo
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap.email=${ADMIN_EMAIL:guilherme_doge1@estudante.sesisenai.org.br}
app.bootstrap.password=${ADMIN_PASSWORD:Dgui@12345}
app.cors.origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
app.navigation.geocoding-url=${GEOCODING_URL:https://nominatim.openstreetmap.org/search}
app.navigation.route-url=${ROUTING_URL:https://router.project-osrm.org}
app.navigation.user-agent=${MAPS_USER_AGENT:Carona-Solidaria/1.0 (corporate carpool; development)}
