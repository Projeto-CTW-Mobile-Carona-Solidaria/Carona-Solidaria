# Activate with SPRING_PROFILES_ACTIVE=observability for local Alloy collection.
logging.file.name=${LOG_FILE:./logs/application.json}
logging.structured.format.file=ecs
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE:./logs/application.json}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
