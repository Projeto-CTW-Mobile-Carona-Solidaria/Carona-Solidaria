global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: carona-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["host.docker.internal:8079"]
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
